name: Build and Release Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build fat JAR
        shell: pwsh
        run: mvn --batch-mode clean package

      - name: Prepare jpackage input
        shell: pwsh
        run: |
          $jar = Get-ChildItem target\*.jar |
            Where-Object { $_.Name -notlike "original-*" } |
            Select-Object -First 1

          if (-not $jar) {
            throw "배포용 JAR을 찾지 못했습니다."
          }

          New-Item -ItemType Directory -Force target\jpackage-input | Out-Null
          Copy-Item $jar.FullName "target\jpackage-input\$($jar.Name)"

          "JAR_NAME=$($jar.Name)" >> $env:GITHUB_ENV

      - name: Build Windows EXE installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace "^v", ""

          New-Item -ItemType Directory -Force target\dist | Out-Null

          jpackage `
            --type exe `
            --name MastodonRpBackup `
            --app-version $version `
            --vendor yeojiyoon `
            --dest target\dist `
            --input target\jpackage-input `
            --main-jar "$env:JAR_NAME" `
            --main-class com.jiyoon.mastodonrpbackup.MastodonRpBackupLauncher `
            --win-shortcut `
            --win-menu

      - name: Show generated package
        shell: pwsh
        run: Get-ChildItem target\dist

      - name: Create GitHub Release and upload EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "target/dist/*.exe" `
            --verify-tag `
            --title "Mastodon RP Backup ${{ github.ref_name }}" `
            --generate-notes