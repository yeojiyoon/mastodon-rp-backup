name: Build and Release Windows EXE

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 이 프로젝트는 현재 순수 JavaFX 앱이므로
      # Spring Initializr가 만든 기본 Spring Boot 테스트는 배포 빌드에서 실행하지 않습니다.
      - name: Build fat JAR
        shell: pwsh
        run: mvn --batch-mode "-DskipTests" "-Dspring-boot.repackage.skip=true" clean package

      - name: Prepare jpackage input
        shell: pwsh
        run: |
          $jar = Get-ChildItem target\*.jar |
            Where-Object { $_.Name -notlike "original-*" } |
            Select-Object -First 1

          if (-not $jar) {
            throw "배포용 JAR을 찾지 못했습니다."
          }

          New-Item -ItemType Directory -Force target\jpackage-input | Out-Null
          Copy-Item $jar.FullName "target\jpackage-input\$($jar.Name)"

          "JAR_NAME=$($jar.Name)" >> $env:GITHUB_ENV

      - name: Build Windows EXE installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace "^v", ""

          New-Item -ItemType Directory -Force target\dist | Out-Null

          jpackage `
            --type exe `
            --name MastodonRpBackup `
            --app-version $version `
            --vendor yeojiyoon `
            --dest target\dist `
            --input target\jpackage-input `
            --main-jar "$env:JAR_NAME" `
            --main-class com.jiyoon.mastodonrpbackup.MastodonRpBackupLauncher `
            --win-shortcut `
            --win-menu

      - name: Show generated package
        shell: pwsh
        run: Get-ChildItem target\dist

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem target\dist\*.exe | Select-Object -First 1

          if (-not $exe) {
            throw "생성된 EXE 파일을 찾지 못했습니다."
          }

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "기존 Release가 있으므로 EXE를 교체합니다."
            gh release upload $tag $exe.FullName --clobber
          }
          else {
            Write-Host "새 Release를 생성합니다."
            gh release create $tag $exe.FullName `
              --verify-tag `
              --title "Mastodon RP Backup $tag" `
              --generate-notes
          }